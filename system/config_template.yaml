# ============================================================================
#
#   phytoclassShiny - CONFIGURATION TEMPLATE
#
#   This is the read-only default template. User settings are saved to
#   'config_session.yaml'.
#
#   This file defines the standard columns, algorithm defaults, pigment
#   display names, and color palettes used for plotting.
#
#   Notable sections:
#   - pigment_registry maps each short code to a full display name, used
#     by the mapping wizard and all exports so users see full names while
#     the engine continues to compute on the original short codes.
#   - 'hour' and 'minute' are recognised metadata keys, with a 'time'
#     alias list, supporting source data with separate date/time columns.
#   - performance.large_dataset_threshold is used by Step 5 to decide
#     when to switch from hierarchical clustering to the scalable K-Means
#     failsafe path (see module_step5_strategy.R for the full rationale).
#   - report_defaults is consumed by the progressive report system
#     (R/core/report_builder.R).
#
# ============================================================================

general:
  project_name: PhytoclassShiny_Project
  config_version: 1.1
  # Metadata keys are non-pigment columns essential for context.
  metadata_keys: [latitude, longitude, depth, year, month, day, hour, minute, date, time, internal_source_id, Tchla]
  # Essential pigments required for the core algorithm to run.
  essential_pigments: [Dvchla, Chl_b, Chl_c1, Chl_c3, Per, X19but, Fuco, X19hex, Pra, Viol, Allo, Zea, Lut, Neox]

# --- PIGMENT REGISTRY ---
# Maps the short codes used internally (and required by the phytoclass
# package's F/S matrix column names) to a full, human-readable display name.
# This registry is display-only: it is never used for matrix math. Every
# calculation continues to use the short code on the left. The mapping
# wizard, results tables, and exported reports show the name on the right.
pigment_registry:
  Per: "Peridinin"
  X19but: "19'-Butanoyloxyfucoxanthin"
  Fuco: "Fucoxanthin"
  Neox: "Neoxanthin"
  Pra: "Prasinoxanthin"
  Viol: "Violaxanthin"
  X19hex: "19'-Hexanoyloxyfucoxanthin"
  Allo: "Alloxanthin"
  Zea: "Zeaxanthin"
  Lut: "Lutein"
  Chl_c1: "Chlorophyll c1/c2"
  Chl_c3: "Chlorophyll c3"
  Chl_b: "Chlorophyll b"
  Dvchla: "Divinyl Chlorophyll a"
  Tchla: "Total Chlorophyll a"

workspace:
  # Default paths relative to the application's root directory.
  output_directory: output/
  fm_pro_matrix_path: R/reference tables/Fm_Pro.xlsx
  fm_nopro_matrix_path: R/reference tables/Fm_NoPro.xlsx

column_aliases:
  # Maps standard internal keys (left) to a list of possible column names
  # found in raw data files (right).
  latitude: [latitude, lat, Lat, LATITUDE, "Lat.", Latitude]
  longitude: [longitude, Longitude, lon, Lon, long, Long, LONGITUDE, "Lon."]
  depth: [depth, Depth, depth_m, Depth_m, "Depth (m)"]
  year: [year, Year, YEAR, YR]
  month: [month, Month, MONTH, MON]
  day: [day, Day, DAY, DY]
  hour: [hour, Hour, HOUR, HR, hh]
  minute: [minute, Minute, MINUTE, MIN, mm_time]
  date: [date, Date, DATE, SampleDate, sample_date, Sampling_date_UTC, DateTime, Date_Time, "Date_Time_UTC", Timestamp, timestamp]
  time: [time, Time, TIME, SampleTime, sample_time, Sampling_time_UTC]
  internal_source_id: [sample_id, station_id, Sample_num, Station, Site, Sample_code, cruise, Cruise]
  Tchla: [Tchla, Total_Chlorophyll_a, Total.Chlorophyll.a, "TChl a", "Total Chla", "Total_Chla", "TChl a"]
  Dvchla: [Dvchla, DVchla, Divinyl_Chlorophyll_a, "DVChla ", DVChl_a, "DVChl_a ", "DV chl a "]
  Chl_b: [Chl_b, TChlb, Chlorophyll_b, "Chlb ", Chl.b, "Chl_b ", "Chl b "]
  Chl_c1: [Chl_c1, Chl_c1c2, "Chlc1 ", "Chlc1+c2 ", "Chl_c1c2 ", "Chl c1+c2 "]
  Chl_c3: [Chl_c3, Chlorophyll_c3, "Chlc3 ", "Chl_c3 ", "Chl c3 "]
  Per: [Per, Perid, Peri, "Perid ", "Peri ", "Perid "]
  X19but: [X19but, "19'-Butanoyloxyfucoxanthin", "19But ", But, "19'-But", "But ", "But-fuco "]
  Fuco: [Fuco, Fucoxanthin, "Fucox ", Fucox, "Fuco ", "Fuco "]
  X19hex: [X19hex, Hex, "19Hex ", "19'-Hex", "Hex ", "Hex-fuco "]
  Pra: [Pra, Pras, Prasino, Prasinoxanthin, "Prasino ", "Pras ", "Pras "]
  Viol: [Viol, Violaxanthin, "Violax ", Violax, "Violax ", "Viola "]
  Allo: [Allo, Alloxanthin, "Allox ", "Allox ", "Allo "]
  Zea: [Zea, Zeaxanthin, "Zeax ", Zeax, "Zea ", "Zea "]
  Lut: [Lut, Lutein, "Lutein ", "Lutein ", "Lut "]
  Neox: [Neox, Neoxanthin, "Neox ", Neo, "Neo ", "Neo "]

filtering:
  # Default states for metadata-based filtering rules.
  geospatial: {enabled: false, min_latitude: -90, max_latitude: 90, min_longitude: -180, max_longitude: 180}
  temporal: {enabled: false, start_date: '1900-01-01', end_date: '2030-01-01'}
  depth: {enabled: false, min_depth: 0, max_depth: 2000}

data_cleaning:
  # Default states for data quality control rules.
  handle_duplicates: {enabled: true}
  handle_pigment_nas: {enabled: true}
  handle_zero_pigment_sum: {enabled: true}
  enforce_non_negative_pigments: {enabled: true}

strategy:
  method: 'By Source File'

clustering:
  # Parameters for the advanced clustering workflow (Step 5).
  imputation_method: 'none'
  normalization_method: 'Ratio to Tchla'
  transformation_method: 'Box-Cox'
  cluster_method: 'Ward''s + DynamicTreeCut'
  distance_method: 'Manhattan'
  k_determination: 'Auto'
  k_max: 5

phytoclass:
  # Default parameters for the core phytoclass algorithm (Step 6).
  niter: 500
  step_size: 0.009
  use_fixed_seed: false
  fixed_seed: 131234
  rmse_review_threshold: 0.1
  # Custom min/max bounds toggle and selected file, if enabled.
  use_custom_minmax: false
  selected_minmax_file: ""

performance:
  # Used to calculate the smart ETA progress bar.
  avg_speed: 0.5
  last_niter: 500
  last_step_size: 0.009
  total_historical_runs: 0
  system_calibration_coefficient: 0.000009
  # --- LARGE DATASET FAILSAFE (Step 5) ---
  # Above this many samples in a single grouping strategy pass, hierarchical
  # clustering (which requires an O(n^2) full pairwise distance matrix) is
  # automatically disabled in favour of K-Means (O(n*k), scales linearly),
  # and diagnostic plots (PCA/dendrogram/silhouette/elbow) are computed on a
  # random representative subsample rather than the full dataset. The final
  # cluster assignment is still applied to every sample; only the *diagnostic
  # plots* are subsampled. See module_step5_strategy.R for the full rationale
  # behind this specific threshold.
  large_dataset_threshold: 5000
  diagnostic_subsample_size: 2000

reporting:
  generate_master_summary: true

  # --- Visualization Settings ---
  plotting:
    custom_palette:
      # --- Red Group (Diatoms) ---
      Diatoms-1: "#CC0000"
      Diatoms-2: "#FF0000"
      Diatoms.1: "#CC0000"
      Diatoms.2: "#FF0000"
      Diatoms: "#FF0000"

      # --- Orange Group (Dinoflagellates) ---
      Dinoflagellates-1: "#ED7D31"
      Dinoflagellates-2: "#F4B084"
      Dinoflagellates.1: "#ED7D31"
      Dinoflagellates: "#ED7D31"

      # --- Brown Group (Cryptophytes) ---
      Cryptophytes: "#B45F04"

      # --- Yellow Group (Pelagophytes/Chrysophytes) ---
      Pelagophytes: "#FFC000"
      Chrysophytes: "#FFD700"

      # --- Purple/Pink Group (Haptophytes) ---
      Haptophytes: "#7030A0"
      Haptophytes-6: "#9933FF"
      Haptophytes-8: "#7030A0"
      Haptophytes.6: "#9933FF"
      Haptophytes.8: "#7030A0"
      Prymnesiophytes: "#7030A0"

      # --- Green Group (Green Algae) ---
      Prasinophytes: "#70AD47"
      Chlorophytes: "#006400"
      Euglenophytes: "#339933"

      # --- Cyan/Blue Group (Cyanobacteria) ---
      Syn: "#00B0F0"
      Synechococcus: "#00B0F0"
      Pro: "#0070C0"
      Prochlorococcus: "#0070C0"
      Cyanobacteria: "#00B0F0"

# --- PROGRESSIVE REPORT DEFAULTS ---
# Consumed by R/core/report_builder.R. Each entry is a section of the final
# downloadable report, keyed to the step that produces it. 'enabled_default'
# governs whether the toggle starts checked once that section becomes
# available; it does NOT control availability itself, availability is always
# computed live from actual workflow state, never from this config.
report_defaults:
  sections:
    setup_information: {enabled_default: true, produced_by_step: 1}
    datasets_loaded: {enabled_default: true, produced_by_step: 2}
    column_mapping_log: {enabled_default: true, produced_by_step: 3}
    quality_control_log: {enabled_default: true, produced_by_step: 4}
    grouping_and_clustering: {enabled_default: true, produced_by_step: 5}
    analysis_results: {enabled_default: true, produced_by_step: 6}
    final_visualizations: {enabled_default: true, produced_by_step: 7}
